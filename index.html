<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Daglig nyhetssammanfattning med källkritisk bedömning.">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1219" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nyhetsankaret">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Nyhetsankaret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky date bar + day strip, overview of four beats, then one column of stories per beat */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#141A24; --muted:#5A6476; --line:#DCE1EA; --accent:#2446C9; --accent-ink:#FFFFFF;
  --teknik:#6247D8; --hallbarhet:#0F8577; --inrikes:#2E6BD1; --utrikes:#B4447E;
  --hog:#2B8A3E; --medel:#B7791F; --lag:#C23B2E; --bg-back:#E6EAF3;
  --k1:#2446C9; --k2:#0F8577; --k3:#B7791F; --k4:#B4447E; --k5:#6B7385;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1219; --surface:#161B24; --ink:#E6EAF1; --muted:#9AA3B4; --line:#262E3D; --accent:#8EA6FF; --accent-ink:#0E1219;
  --teknik:#A796FF; --hallbarhet:#4CC7B4; --inrikes:#7FA9F2; --utrikes:#E58BB8;
  --hog:#5BC170; --medel:#E3AE52; --lag:#F07A6C; --bg-back:#141B29;
  --k1:#8EA6FF; --k2:#4CC7B4; --k3:#E3AE52; --k4:#E58BB8; --k5:#8A93A6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1219; --surface:#161B24; --ink:#E6EAF1; --muted:#9AA3B4; --line:#262E3D; --accent:#8EA6FF; --accent-ink:#0E1219;
  --teknik:#A796FF; --hallbarhet:#4CC7B4; --inrikes:#7FA9F2; --utrikes:#E58BB8;
  --hog:#5BC170; --medel:#E3AE52; --lag:#F07A6C; --bg-back:#141B29;
  --k1:#8EA6FF; --k2:#4CC7B4; --k3:#E3AE52; --k4:#E58BB8; --k5:#8A93A6; color-scheme:dark;}

*{box-sizing:border-box}
body{transition:background .3s;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.bar{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dayline{flex:1;min-width:0}
.dayline h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,5.4vw,30px);line-height:1.1;text-wrap:balance}
.navbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:18px}
.navbtn:disabled{opacity:.25;cursor:not-allowed;background:transparent;border-style:dashed}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;display:grid;justify-items:center;gap:1px;min-width:48px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip b{font-family:var(--display);font-size:17px;color:var(--ink);letter-spacing:0}
.chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-current="true"] b{color:var(--accent-ink)}
.chip .unread{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chip[aria-current="true"] .unread{background:var(--accent-ink)}

main .wrap{padding-block:20px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
main .wrap>*{min-width:0}
article,.lede,.watch,.state,.beat{overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
html,body{overflow-x:hidden}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.lede{margin:0;font-size:19px;line-height:1.5;max-width:62ch}

/* Overview */
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
.beat{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;cursor:pointer;min-width:0;transition:opacity .15s,border-color .15s,background .15s}
.beat:hover{border-color:var(--c)}
.beat[aria-pressed="true"]{border:2px solid var(--c);padding:11px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.filtered .beat[aria-pressed="false"]{opacity:.5}
.showall{margin-left:auto;font-family:var(--mono);font-size:12px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.beat .name{font-family:var(--display);font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.beat .name i{flex:none}
.beat .name i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.beat .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rel{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);gap:2px}
.rel span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:6px;border-radius:2px}

/* Sections */
section.beatsec{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;scroll-margin-top:150px;min-width:0}
.sechead{display:flex;align-items:baseline;gap:10px;border-top:3px solid var(--c);padding-top:10px}
.sechead h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;color:var(--c)}
.sechead span{font-family:var(--mono);font-size:12px;color:var(--muted)}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
article h3{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;text-wrap:balance}
article p{margin:0;max-width:65ch}
.signals{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.pill{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:var(--r);background:color-mix(in srgb,var(--r) 14%,transparent);border:1px solid color-mix(in srgb,var(--r) 35%,transparent)}
.weak{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--lag)}
.dots{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.assess{font-size:15.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.assess b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-right:6px}
.sources{display:flex;flex-wrap:wrap;gap:6px}
.sources a{font-family:var(--mono);font-size:12px;text-decoration:none;padding:4px 9px;border-radius:7px;border:1px solid var(--line);color:var(--accent);max-width:100%;overflow-wrap:anywhere}
.sources a:hover{border-color:var(--accent)}
.watch{padding:16px 18px;border-radius:14px;border:1px dashed var(--accent);display:grid;gap:6px}
.watch h2{margin:0;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.watch p{margin:0}
/* Baksidan */
.sidebar{display:flex;align-items:center;gap:10px}
.sidebar .strip{flex:1;min-width:0}
.flip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.04em;cursor:pointer}
.flip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.flip svg{width:14px;height:14px}
body.back{--bg:var(--bg-back)}
.backhead{display:grid;gap:6px}
.backhead .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.backhead h2{margin:0;font-family:var(--display);font-size:20px}
.backhead p{margin:0;color:var(--muted);max-width:60ch}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--line);color:var(--ink)}
.why{font-size:15.5px;border-left:2px solid var(--accent);padding-left:12px}
.why b{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.rota{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rota span{padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.rota span.on{border-color:var(--accent);color:var(--accent)}
.bias{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.bias .lead{margin:0;font-size:16px}
.metric{display:grid;gap:6px;min-width:0}
.metric .lbl{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.metric .lbl b{color:var(--ink);font-weight:500}
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line)}
.sbar span{display:block;min-width:3px}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:9px;height:9px;border-radius:2px}
.toplist{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-family:var(--mono);font-size:12px}
.toplist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.toplist li span:first-child{min-width:0;overflow-wrap:anywhere}
.note{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.flipping{animation:flipin .45s cubic-bezier(.2,.7,.2,1) both}@keyframes flipin{from{transform:perspective(1400px) rotateY(-80deg);opacity:0}to{transform:none;opacity:1}}}

.state{padding:40px 0;display:grid;gap:10px;max-width:52ch}
.state h2{margin:0;font-family:var(--display);font-size:22px}
.state p{margin:0;color:var(--muted)}
.foot{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding-bottom:24px}
@media (prefers-reduced-motion:no-preference){article{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}

html{color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="navbtn" id="prev" aria-label="Föregående dag" disabled>‹</button>
      <div class="dayline">
        <div class="brand">Nyhetsankaret</div>
        <h1 id="dayTitle">Dagens nyhetsläge</h1>
      </div>
      <button class="navbtn" id="next" aria-label="Nästa dag" disabled>›</button>
    </div>
    <div class="sidebar">
      <nav class="strip" id="strip" aria-label="Välj dag"></nav>
      <button class="flip" id="flip" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 6.5A5.5 5.5 0 0 0 3.2 4.8M2.5 9.5a5.5 5.5 0 0 0 10.3 1.7"/><path d="M3 2v3h3M13 14v-3h-3"/></svg><span>Baksidan</span></button>
    </div>
  </div>
</header>

<main><div class="wrap" id="view">
  <div class="state" id="state">
    <h2>Hämtar rapporterna…</h2>
    <p>Varje morgon kring 09:00 läggs en ny sammanfattning till här: teknik, hållbarhet, inrikes- och utrikespolitik, med källkritisk bedömning av varje nyhet.</p>
  </div>
</div></main>
<div class="foot wrap">Sammanställd av Claude från minst tre oberoende källor per nyhet där det går.</div>

<script>
const BEATS=[
  {id:"teknik",name:"Teknik"},
  {id:"hallbarhet",name:"Hållbarhet"},
  {id:"inrikes",name:"Inrikespolitik"},
  {id:"utrikes",name:"Utrikespolitik"}
];
const REL={hog:"Hög",medel:"Medel",lag:"Låg"};
const DAYS=["sön","mån","tis","ons","tors","fre","lör"];
const $=s=>document.querySelector(s);
let reports=[]; // sorted newest first
let current=null;
let filter=null; // null = alla områden

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseDate(d){const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd)}
function longDate(d){return parseDate(d).toLocaleDateString("sv-SE",{weekday:"long",day:"numeric",month:"long"}).replace(/^./,c=>c.toUpperCase())}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}}
function relKey(r){r=String(r||"").toLowerCase().replace("ö","o").replace("å","a").replace("ä","a");return REL[r]?r:"medel"}
function readSet(){try{return new Set(JSON.parse(localStorage.getItem("ml-read")||"[]"))}catch{return new Set()}}
function markRead(d){try{const s=readSet();s.add(d);localStorage.setItem("ml-read",JSON.stringify([...s].slice(-90)))}catch{}}

function state(title,text){$("#view").innerHTML=`<div class="state"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`}

function renderStrip(){
  const read=readSet();
  $("#strip").innerHTML=reports.slice(0,21).map(r=>{
    const d=parseDate(r.date);
    return `<button class="chip" data-d="${esc(r.date)}" aria-current="${r.date===current}" aria-label="${esc(longDate(r.date))}">
      ${DAYS[d.getDay()]}<b>${d.getDate()}</b>${read.has(r.date)||r.date===current?"":'<span class="unread"></span>'}</button>`}).join("");
  const cur=$("#strip [aria-current=true]"); if(cur){const st=$("#strip");const l=cur.offsetLeft-st.offsetLeft;if(l<st.scrollLeft||l+cur.offsetWidth>st.scrollLeft+st.clientWidth)st.scrollLeft=l-8}
  const i=reports.findIndex(r=>r.date===current);
  $("#prev").disabled=i<0||i>=reports.length-1;
  $("#next").disabled=i<=0;
}

const ROTATION=["Något udda eller hoppfullt","Afrika","Vetenskap","Latinamerika","Kultur","Asien och Oceanien","Något udda eller hoppfullt"];
const KINDS=[["public","Public service","--k1"],["kommersiell","Kommersiell media","--k2"],["nyhetsbyra","Nyhetsbyrå","--k3"],["myndighet","Myndighet / organisation","--k4"],["ovrigt","Blogg / övrigt","--k5"]];
let side="front";

function itemHTML(it,extra=""){
  const k=relKey(it.reliability);
  const n=Number(it.independentSources)||(it.sources||[]).length||0;
  const dots=Array.from({length:Math.max(3,n)},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("");
  const src=(it.sources||[]).map(x=>{const u=safeUrl(x.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(x.name||new URL(u).hostname)}</a>`:""}).join("");
  return `<article>
    ${extra}
    <h3>${esc(it.title)}</h3>
    <div class="signals">
      <span class="pill" style="--r:var(--${k})">${REL[k]} tillförlitlighet</span>
      <span class="dots" title="Antal oberoende källor">${dots} ${n} oberoende ${n===1?"källa":"källor"}</span>
      ${it.weak?'<span class="weak">Svagare underlag</span>':""}
    </div>
    <p>${esc(it.summary)}</p>
    ${it.why?`<p class="why"><b>Därför värt att veta</b>${esc(it.why)}</p>`:""}
    ${it.assessment?`<p class="assess"><b>Källkritik</b>${esc(it.assessment)}</p>`:""}
    ${src?`<div class="sources">${src}</div>`:""}
  </article>`;
}

function render(){
  const r=reports.find(x=>x.date===current);
  if(!r){state("Ingen rapport för den dagen","Välj en annan dag i listan ovan.");return}
  $("#dayTitle").textContent=longDate(r.date);
  document.body.classList.toggle("back",side==="back");
  $("#flip").setAttribute("aria-pressed",String(side==="back"));
  $("#flip span").textContent=side==="back"?"Framsidan":"Baksidan";
  if(!r.sections){
    renderStrip();
    if(r.failed){state("Rapporten kunde inte laddas","Kontrollera uppkopplingen och ladda om sidan.");return}
    state("Hämtar rapporten…","");
    loadReport(r).then(()=>{if(current===r.date)render()});
    return;
  }
  markRead(r.date);
  if(side==="back") renderBack(r); else renderFront(r);
  renderStrip();
}

function renderFront(r){
  const secs=BEATS.map(b=>({...b,items:((r.sections||[]).find(s=>s.id===b.id)||{}).items||[]}));
  let gen="";
  if(r.generatedAt){const g=new Date(r.generatedAt);if(!isNaN(g))gen=`Sammanställd ${g.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit"})}`}
  const total=secs.reduce((n,s)=>n+s.items.length,0);
  const overview=secs.map(s=>{
    const c={hog:0,medel:0,lag:0}; s.items.forEach(it=>c[relKey(it.reliability)]++);
    const bars=s.items.length?["hog","medel","lag"].filter(k=>c[k]).map(k=>`<span style="flex:${c[k]};background:var(--${k})"></span>`).join(""):"";
    return `<button class="beat" data-beat="${s.id}" aria-pressed="${filter===s.id}" style="--c:var(--${s.id})">
      <span class="name"><i></i>${s.name}</span>
      <span class="count">${s.items.length} ${s.items.length===1?"nyhet":"nyheter"}</span>
      <span class="rel" aria-label="Tillförlitlighet: ${c.hog} hög, ${c.medel} medel, ${c.lag} låg">${bars}</span></button>`}).join("");
  const shown=secs.filter(s=>(!filter||s.id===filter));
  const empty=filter&&!shown.some(s=>s.items.length)?`<div class="state"><h2>Inga nyheter inom ${esc(shown[0]?.name||"")} den här dagen</h2><p>Välj ett annat område eller visa alla.</p></div>`:"";
  const sections=empty+shown.filter(s=>s.items.length).map(s=>`
    <section class="beatsec" id="sec-${s.id}" style="--c:var(--${s.id})">
      <div class="sechead"><h2>${s.name}</h2><span>${s.items.length} ${s.items.length===1?"nyhet":"nyheter"}</span></div>
      ${s.items.map(it=>itemHTML(it)).join("")}
    </section>`).join("");
  $("#view").innerHTML=`
    <div class="meta"><span>${total} nyheter</span>${gen?`<span>${gen}</span>`:""}<span>Senaste dygnet</span>${reports.length===1?"<span>Första rapporten i arkivet, fler dagar fylls på varje morgon</span>":""}</div>
    ${r.lede?`<p class="lede">${esc(r.lede)}</p>`:""}
    <div style="display:grid;gap:10px">
      <div class="overview${filter?" filtered":""}" role="group" aria-label="Välj område">${overview}</div>
      <div class="legend"><span><i style="background:var(--hog)"></i>Hög</span><span><i style="background:var(--medel)"></i>Medel</span><span><i style="background:var(--lag)"></i>Låg tillförlitlighet</span>${filter?'<button class="showall" data-all>Visa alla områden</button>':""}</div>
    </div>
    ${sections}
    ${r.watch?`<div class="watch"><h2>Att bevaka</h2><p>${esc(r.watch)}</p></div>`:""}
    <button class="flip" data-flipback style="justify-self:start">Vänd till baksidan: det du annars missar</button>`;
}

// Källornas ursprung: fälten country/kind/owner i rapporten, annars en gissning från adressen (.se = svensk)
function srcInfo(x){
  let host="";try{host=new URL(x.url).hostname.replace(/^www\./,"")}catch{}
  const country=String(x.country||(/\.se$/.test(host)?"SE":"")).toUpperCase();
  const kind=KINDS.some(k=>k[0]===x.kind)?x.kind:null;
  const owner=x.owner||x.name||host||"Okänd";
  return {country,kind,owner};
}
function countryName(c){try{return new Intl.DisplayNames(["sv"],{type:"region"}).of(c)||c}catch{return c}}
function biasHTML(r){
  const all=[];(r.sections||[]).forEach(s=>(s.items||[]).forEach(it=>(it.sources||[]).forEach(x=>all.push(srcInfo(x)))));
  if(!all.length) return "";
  const n=all.length, pct=v=>Math.round(100*v/n);
  const se=all.filter(a=>a.country==="SE").length, fo=n-se;
  const countries={};all.filter(a=>a.country&&a.country!=="SE").forEach(a=>countries[a.country]=(countries[a.country]||0)+1);
  const topC=Object.entries(countries).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const owners={};all.forEach(a=>owners[a.owner]=(owners[a.owner]||0)+1);
  const own=Object.entries(owners).sort((a,b)=>b[1]-a[1]);
  const kinds={};all.forEach(a=>{if(a.kind)kinds[a.kind]=(kinds[a.kind]||0)+1});
  const kindKnown=Object.values(kinds).reduce((x,y)=>x+y,0);
  const lead=`${pct(se)} % av framsidans ${n} källänkar kommer från svenska medier och ${100-pct(se)} % från utländska. De fördelar sig på ${own.length} olika källor, och den mest använda (${esc(own[0][0])}) står för ${own[0][1]} av dem.`;
  const kindBlock=kindKnown?`<div class="metric"><div class="lbl"><span>Typ av källa</span><b>${kindKnown} av ${n} klassade</b></div>
      <div class="sbar">${KINDS.filter(k=>kinds[k[0]]).map(k=>`<span style="flex:${kinds[k[0]]};background:var(${k[2]})"></span>`).join("")}</div>
      <div class="keys">${KINDS.filter(k=>kinds[k[0]]).map(k=>`<span><i style="background:var(${k[2]})"></i>${k[1]} ${kinds[k[0]]}</span>`).join("")}</div></div>`
    :`<p class="note">Typ av källa (public service, kommersiell media, nyhetsbyrå …) visas från och med rapporter som klassar sina källor.</p>`;
  return `<section class="bias" aria-label="Framsidans källor">
    <div class="backhead"><span class="eyebrow">Ögonöppnaren</span><h2>Så ser framsidans urval ut</h2></div>
    <p class="lead">${lead}</p>
    <div class="metric"><div class="lbl"><span>Svenska och utländska källor</span><b>${se} / ${fo}</b></div>
      <div class="sbar">${se?`<span style="flex:${se};background:var(--k1)"></span>`:""}${fo?`<span style="flex:${fo};background:var(--k4)"></span>`:""}</div>
      <div class="keys"><span><i style="background:var(--k1)"></i>Svenska ${pct(se)} %</span><span><i style="background:var(--k4)"></i>Utländska ${100-pct(se)} %</span></div>
      ${topC.length?`<ul class="toplist">${topC.map(([c,v])=>`<li><span>${esc(countryName(c))}</span><span>${v}</span></li>`).join("")}</ul>`:""}</div>
    ${kindBlock}
    <div class="metric"><div class="lbl"><span>Mest använda källor</span><b>${own.length} olika</b></div>
      <ul class="toplist">${own.slice(0,5).map(([o,v])=>`<li><span>${esc(o)}</span><span>${v}</span></li>`).join("")}</ul></div>
  </section>`;
}

function renderBack(r){
  const bs=r.backside||{};
  const must=bs.mustKnow||[];
  const unk=bs.unknown||null;
  const dow=parseDate(r.date).getDay();
  const theme=(unk&&unk.theme)||ROTATION[dow];
  const rota=[1,2,3,4,5,6,0].map(d=>`<span class="${d===dow?"on":""}">${DAYS[d]} · ${ROTATION[d]}</span>`).join("");
  const missing=!r.backside?`<p class="note">Baksidans nyheter finns från och med rapporten den 9 november. Ögonöppnaren nedan fungerar för alla dagar.</p>`:"";
  $("#view").innerHTML=`
    <div class="backhead"><span class="eyebrow">Baksidan</span>
      <p>Det som ligger utanför dina fyra områden: dygnets måsten, en nyhet från okänd mark och en blick på framsidans eget urval.</p></div>
    ${missing}
    ${must.length?`<section class="beatsec" style="--c:var(--accent)">
      <div class="sechead"><h2>Inte att missa</h2><span>oavsett ämne</span></div>
      ${must.map(it=>itemHTML(it,it.area?`<div><span class="tag">${esc(it.area)}</span></div>`:"")).join("")}
    </section>`:""}
    ${unk&&unk.item?`<section class="beatsec" style="--c:var(--utrikes)">
      <div class="sechead"><h2>Okänd mark</h2><span>${esc(theme)}</span></div>
      ${itemHTML(unk.item)}
      <div class="rota" aria-label="Veckans teman">${rota}</div>
    </section>`:""}
    ${biasHTML(r)}`;
}

function go(d,push=true){current=d;if(push){try{history.replaceState(null,"","#"+d)}catch{location.hash=d}}render();window.scrollTo({top:0})}
function flipTo(next){
  side=next;render();window.scrollTo({top:0});
  const v=$("#view");v.classList.remove("flipping");void v.offsetWidth;v.classList.add("flipping");
}
$("#flip").onclick=()=>flipTo(side==="back"?"front":"back");

document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(chip){go(chip.dataset.d);return}
  const b=e.target.closest("[data-beat]"); if(b){filter=filter===b.dataset.beat?null:b.dataset.beat;render();return}
  if(e.target.closest("[data-all]")){filter=null;render()}
  if(e.target.closest("[data-flipback]")){flipTo("back")}
});
$("#prev").onclick=()=>{const i=reports.findIndex(r=>r.date===current);if(reports[i+1])go(reports[i+1].date)};
$("#next").onclick=()=>{const i=reports.findIndex(r=>r.date===current);if(i>0)go(reports[i-1].date)};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==current&&reports.some(r=>r.date===h))go(h,false)});

(async()=>{
  await loadIndex();
})();

// Rapporterna ligger som JSON-filer bredvid sidan: reports/index.json + reports/ÅÅÅÅ-MM-DD.json
async function loadReport(r){
  try{
    const res=await fetch(`reports/${r.date}.json`,{cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    Object.assign(r,await res.json());
  }catch{r.failed=true}
}
async function loadIndex(){
  try{
    const res=await fetch("reports/index.json",{cache:"no-cache"});
    if(!res.ok) throw new Error(res.status);
    const dates=((await res.json()).dates||[]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort().reverse();
    const known=new Map(reports.map(r=>[r.date,r]));
    reports=dates.map(d=>known.get(d)||{date:d});
  }catch{
    if(!reports.length) state("Rapporterna går inte att nå just nu","Kontrollera uppkopplingen och ladda om sidan.");
    return;
  }
  if(!reports.length){state("Inga rapporter än","Den första sammanfattningen dyker upp här efter nästa morgonkörning kring 09:00.");return}
  const h=location.hash.slice(1);
  if(!current||!reports.some(r=>r.date===current)) current=reports.some(r=>r.date===h)?h:reports[0].date;
  render();
}
// Hämta nya dagar när appen öppnas igen från hemskärmen
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadIndex()});
</script>
